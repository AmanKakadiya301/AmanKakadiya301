name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: AmanKakadiya301
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8B5CF6&color_dots=ebedf0,c6e48b,7bc96f,239a3b,196127
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=8B5CF6&color_dots=ffffff,d8b4fe,c084fc,a855f7,7e22ce

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
